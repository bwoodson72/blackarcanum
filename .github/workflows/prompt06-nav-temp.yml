name: Verify responsive header navigation (temporary)

on:
  push:
    branches: [feature/prompt-06-responsive-header]
    paths: [.github/workflows/prompt06-nav-temp.yml]

permissions:
  contents: read

jobs:
  nav:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
      - name: Baseline build, typecheck and audit
        run: |
          npm ci
          npm run typecheck
          npm run build
          npm audit --audit-level=high
      - name: Inspect generated HTML and live links
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          class H(HTMLParser):
              def __init__(self): super().__init__();self.tags=[]
              def handle_starttag(self,t,attrs):self.tags.append((t,dict(attrs)))
              def find(self,t,**attrs):
                  return [a for k,a in self.tags if k==t and all(a.get(k)==v for k,v in attrs.items())]
          html=Path('.vercel/output/static/index.html').read_text()
          p=H();p.feed(html)
          assert len(p.find('header',**{'class':'site-header'}))==1
          assert len(p.find('main',id='main-content'))==1
          assert p.find('a',href='/',**{'aria-label':'Mystagogia — Home'})
          assert p.find('button',**{'aria-haspopup':'dialog','aria-expanded':'false'})
          assert p.find('dialog',id='mobile-navigation-dialog')
          assert p.find('meta',name='robots',content='noindex, nofollow')
          hrefs={a['href'] for t,a in p.tags if t=='a' and a.get('href')}
          assert hrefs=={'#main-content','/'},hrefs
          assert all(x not in html for x in ('/shop/','/library/','/grimoire/','/about/','/search/','/subscribe/'))
          assert 'Astro Basics' not in html
          assert not p.find('meta',property='og:url')
          assert not p.find('link',rel='canonical')
          print('NAV_HTML_PASS: header, noindex, all 2 links valid, no dead destinations')
          PY
      - name: Chrome width, dialog, keyboard and Escape validation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 --directory .vercel/output/static >/tmp/header-server.log 2>&1 &
          site=$!
          google-chrome --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --remote-debugging-port=9222 --remote-allow-origins='*' --user-data-dir=/tmp/header-chrome about:blank >/tmp/header-chrome.log 2>&1 &
          chrome=$!
          trap 'kill "$site" "$chrome" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8765/ -o /tmp/header-home.html && curl -sf http://127.0.0.1:9222/json -o /tmp/header-tabs.json; then break; fi
            sleep 0.25
          done
          test -s /tmp/header-home.html
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const targets=await (await fetch('http://127.0.0.1:9222/json')).json();
          const target=targets.find(x=>x.type==='page');
          const ws=new WebSocket(target.webSocketDebuggerUrl);
          await new Promise((resolve,reject)=>{ws.onopen=resolve;ws.onerror=reject});
          const pending=new Map();let seq=0;
          ws.onmessage=(event)=>{const obj=JSON.parse(event.data);if(!obj.id)return;const p=pending.get(obj.id);if(!p)return;pending.delete(obj.id);obj.error?p.reject(new Error(JSON.stringify(obj.error))):p.resolve(obj.result)};
          const send=(method,params={})=>new Promise((resolve,reject)=>{const id=++seq;pending.set(id,{resolve,reject});ws.send(JSON.stringify({id,method,params}));setTimeout(()=>{if(pending.has(id)){pending.delete(id);reject(new Error(method+' timeout'))}},12000)});
          const evalJs=async expression=>(await send('Runtime.evaluate',{expression,returnByValue:true,awaitPromise:true})).result?.value;
          const wait=ms=>new Promise(r=>setTimeout(r,ms));
          await send('Page.enable');await send('Runtime.enable');
          const probe=`(() => {
            const h=document.querySelector('.site-header'),b=document.querySelector('[data-menu-trigger]'),d=document.querySelector('[data-menu-dialog]'),mark=document.querySelector('.brand');
            if(!h||!b||!d||!mark)return null;
            const css=getComputedStyle(b);
            if(!document.styleSheets.length || parseFloat(getComputedStyle(document.body).marginLeft)!==0)return null;
            return {width:innerWidth,scroll:document.documentElement.scrollWidth,headerWidth:Math.round(h.getBoundingClientRect().width),brandRight:mark.getBoundingClientRect().right,triggerDisplay:css.display,headerBg:getComputedStyle(h).backgroundColor,menuOpen:d.open};
          })()`;
          for(const width of [375,768,1024,1440]){
            await send('Emulation.setDeviceMetricsOverride',{width,height:900,deviceScaleFactor:1,mobile:false});
            await send('Page.navigate',{url:'http://127.0.0.1:8765/'});
            let v;
            for(let tries=0;tries<50;tries++){v=await evalJs(probe);if(v&&v.headerBg==='rgb(26, 26, 26)')break;await wait(100)}
            assert(v,'Header or CSS not ready at '+width);
            assert.equal(v.width,width);
            assert(v.scroll<=width+1,'Horizontal overflow at '+width+': '+v.scroll);
            assert(v.brandRight<=width,'Wordmark clipped at '+width);
            assert(v.headerWidth<=width+1,'Header too wide at '+width);
            assert.equal(v.triggerDisplay==='none',width>=1024,'Wrong menu breakpoint '+width);
            console.log('VIEWPORT_PASS',JSON.stringify(v));
            if(width!==375)continue;
            // Loading the bundled menu module is async: wait for click handler.
            for(let tries=0;tries<30;tries++){
              await evalJs("document.querySelector('[data-menu-trigger]').click()");
              const o=await evalJs("document.querySelector('[data-menu-dialog]').open");
              if(o)break;await wait(100);
            }
            const opened=await evalJs(`(() => {
              const d=document.querySelector('[data-menu-dialog]'),b=document.querySelector('[data-menu-trigger]');
              return {open:d.open,expanded:b.getAttribute('aria-expanded'),focus:document.activeElement?.getAttribute('data-menu-close')!==null,links:[...d.querySelectorAll('a')].map(a=>a.getAttribute('href'))};
            })()`);
            assert.equal(opened.open,true,'Drawer failed to open');
            assert.equal(opened.expanded,'true');
            assert.equal(opened.focus,true,'Close control did not receive focus');
            assert.deepEqual(opened.links,['/']);
            await send('Input.dispatchKeyEvent',{type:'keyDown',key:'Tab',code:'Tab',windowsVirtualKeyCode:9,nativeVirtualKeyCode:9});
            await send('Input.dispatchKeyEvent',{type:'keyUp',key:'Tab',code:'Tab',windowsVirtualKeyCode:9,nativeVirtualKeyCode:9});
            const contained=await evalJs("document.querySelector('[data-menu-dialog]').contains(document.activeElement)");
            assert(contained,'Tab focus escaped the native modal dialog');
            await send('Input.dispatchKeyEvent',{type:'keyDown',key:'Escape',code:'Escape',windowsVirtualKeyCode:27,nativeVirtualKeyCode:27});
            await send('Input.dispatchKeyEvent',{type:'keyUp',key:'Escape',code:'Escape',windowsVirtualKeyCode:27,nativeVirtualKeyCode:27});
            await wait(120);
            const closed=await evalJs(`(() => {
              const d=document.querySelector('[data-menu-dialog]'),b=document.querySelector('[data-menu-trigger]');
              return {open:d.open,expanded:b.getAttribute('aria-expanded'),focused:document.activeElement===b};
            })()`);
            assert.deepEqual(closed,{open:false,expanded:'false',focused:true},'Escape/focus return failed');
            await evalJs("document.querySelector('[data-menu-trigger]').click()");
            await wait(70);
            await evalJs("document.querySelector('[data-menu-close]').click()");
            await wait(70);
            assert.equal(await evalJs("document.querySelector('[data-menu-dialog]').open"),false,'Close button failed');
            console.log('DIALOG_PASS: open, aria, focus, Tab confinement, Escape and Close button');
          }
          ws.close();
          JS
