name: Prompt 08 verification (temporary)

on:
  push:
    branches:
      - feature/prompt-08-about-page

permissions:
  contents: read

jobs:
  verify-about:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Security audit
        run: npm audit --audit-level=high
      - name: Check generated routes and navigation
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import path from "node:path";
          import assert from "node:assert/strict";

          const pages = [];
          const walk = (dir) => {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const file = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(file);
              else if (entry.name.endsWith(".html")) pages.push({ file, html: fs.readFileSync(file, "utf8") });
            }
          };
          walk("dist");
          console.log("Generated HTML:", pages.map((p) => p.file));
          const about = pages.find((p) => /<title>About \| Mystagogia<\/title>/.test(p.html));
          assert.ok(about, "About page HTML must exist");
          const { html } = about;
          assert.match(html, /<h1[^>]*>About Mystagogia<\/h1>/);
          assert.match(html, /<meta name="description"/);
          assert.doesNotMatch(html, /<meta name="robots"[^>]+noindex/);
          assert.match(html, /The Library/);
          assert.match(html, /The Grimoire/);
          assert.match(html, /historical account/);
          assert.match(html, /firsthand/);
          assert.match(html, /href="\/"/);
          const aboutNav = [...html.matchAll(/<a\b[^>]*href="\/about\/"[^>]*>/g)];
          assert.ok(aboutNav.length >= 3, "About should be linked in desktop, mobile, footer navigation");
          assert.match(html, /aria-current="page"/);
          assert.doesNotMatch(html, /href="\/(library|grimoire|shop|search|newsletter|contact|privacy|terms)\/"/);
          assert.doesNotMatch(html, /Brian|Woodson|Subscribe now|Newsletter form/);
          const home = pages.find((p) => /<title>Mystagogia<\/title>/.test(p.html));
          assert.ok(home, "Existing homepage remains");
          assert.match(home.html, /href="\/about\//);
          console.log("PASS: About route, metadata, editorial distinction, links, and unpublished-route gate");
          NODE
      - name: Responsive and mobile navigation Chrome smoke
        run: node scripts/temp-prompt-08-browser-check.mjs
