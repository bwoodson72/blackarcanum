name: Astro baseline checks

# Only for proposed PR changes. Pushes to master are checked by the
# Editorial Quality fast workflow, avoiding a duplicate npm ci/build/typecheck.
on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
      - name: Clean dependency installation
        run: npm ci
      - name: Production build
        run: npm run build
      - name: Astro typecheck
        run: npm run typecheck
      - name: Security audit (high and critical)
        run: npm audit --audit-level=high
