name: Astro baseline checks

on:
  push:
    branches:
      - master
      - chore/prompt-01-baseline
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
      - name: Clean dependency installation
        run: npm ci
      - name: Production build
        run: npm run build
      - name: Astro typecheck
        run: npm run typecheck
      - name: Report dependency audit findings (non-blocking)
        shell: bash
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node --input-type=module -e '
            import fs from "node:fs";
            const audit = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/npm-audit.json", "utf8"));
            const issues = Object.entries(audit.vulnerabilities ?? {}).map(([name, data]) => ({
              name,
              severity: data.severity,
              direct: data.isDirect,
              fixAvailable: data.fixAvailable
            }));
            console.log(JSON.stringify({ counts: audit.metadata?.vulnerabilities, issues }, null, 2));
          '
