name: Verify Vercel server route (temporary)

on:
  push:
    branches: [chore/prompt-01-baseline]

permissions:
  contents: read

jobs:
  adapter-on-demand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
      - name: Install committed lockfile
        run: npm ci
      - name: Confirm no high-severity vulnerabilities
        run: npm audit --audit-level=high
      - name: Compile current static site
        run: npm run build
      - name: Typecheck
        run: npm run typecheck
      - name: Compile opt-in on-demand route with server output and assert function exists
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src/pages/api
          printf 'export const prerender = false;\nexport function GET() { return new Response("adapter-ready"); }\n' > src/pages/api/__adapter_smoke.ts
          sed -i "/adapter: vercel(),/a\\  output: 'server'," astro.config.mjs
          npm run build
          echo 'Vercel output layout:'
          find .vercel/output -maxdepth 5 -type d -print | head -45
          test -d .vercel/output/functions
          find .vercel/output/functions -maxdepth 4 -type f | head -30
          test -n "$(find .vercel/output/functions -name '*.func' -type d -print -quit)"
          echo 'On-demand Vercel function artifact verified.'
