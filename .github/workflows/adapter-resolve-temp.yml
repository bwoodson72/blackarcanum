name: Verify Vercel server route (temporary)

on:
  push:
    branches: [chore/prompt-01-baseline]

permissions:
  contents: read

jobs:
  adapter-on-demand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
      - name: Install committed lockfile
        run: npm ci
      - name: Confirm no high-severity vulnerabilities
        run: npm audit --audit-level=high
      - name: Compile current static site
        run: npm run build
      - name: Typecheck
        run: npm run typecheck
      - name: Verify adapter can compile an opt-in on-demand route
        run: |
          mkdir -p src/pages/api
          printf 'export const prerender = false;\nexport function GET() { return new Response("adapter-ready"); }\n' > src/pages/api/__adapter_smoke.ts
          npm run build
          echo 'Vercel-generated function directories:'
          find . -maxdepth 6 -name '*.func' -type d -print | head -20
          rm src/pages/api/__adapter_smoke.ts
