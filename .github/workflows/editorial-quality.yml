# Fast checks for every master push — one real build, not two workflows.
name: Editorial Quality

on:
  push:
    branches:
      - master
      - "feature/**"

permissions:
  contents: read

# Only the newest pending check for a branch is relevant. A newer commit
# supersedes an older push, reducing wasted build minutes on quick fixes.
concurrency:
  group: mystagogia-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  editorial:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: npm
      - name: Install locked dependencies once
        run: npm ci
      - name: Unit, published-content, build, typecheck and security checks
        run: npm run qa:fast
