name: Editorial Quality

on:
  push:
    branches:
      - master
      - "feature/**"

permissions:
  contents: read

jobs:
  editorial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: npm
      - name: Clean dependency install
        run: npm ci
      - name: Schema, integrity, presentation, archive tests and production build
        run: npm run qa:content
      - name: Astro and TypeScript diagnostics
        run: npm run typecheck
      - name: Security audit
        run: npm audit --audit-level=high
      - name: Empty Library responsive and accessibility QA (Prompt 13 only)
        if: github.ref == 'refs/heads/feature/prompt-13-library-hub'
        run: node scripts/test-library-browser.mjs --empty
      - name: Isolated 0/1/12/13/25-entry MDX builds (Prompt 13 only)
        if: github.ref == 'refs/heads/feature/prompt-13-library-hub'
        run: node scripts/test-library-build-fixtures.mjs
      - name: Published archive responsive and accessibility QA (Prompt 13 only)
        if: github.ref == 'refs/heads/feature/prompt-13-library-hub'
        run: node scripts/test-library-browser.mjs --full
      - name: Empty Grimoire mobile and desktop QA (Prompt 14 only)
        if: github.ref == 'refs/heads/feature/prompt-14-grimoire-hub'
        run: node scripts/test-grimoire-browser.mjs --empty
      - name: Isolated Grimoire 0/1/12/13/25-entry MDX builds (Prompt 14 only)
        if: github.ref == 'refs/heads/feature/prompt-14-grimoire-hub'
        run: node scripts/test-grimoire-build-fixtures.mjs
      - name: Published Grimoire responsive and pagination QA (Prompt 14 only)
        if: github.ref == 'refs/heads/feature/prompt-14-grimoire-hub'
        run: node scripts/test-grimoire-browser.mjs --full
      - name: Media source provenance — missing registered file must fail Astro build
        if: github.ref == 'refs/heads/master'
        run: npm run test:media-build
      - name: Published Library and Grimoire article routes — isolated MDX fixtures
        if: github.ref == 'refs/heads/master'
        run: npm run test:article-routes
      - name: Reading shell layout — real Chrome at 375, 768, 1024 and 1440
        if: github.ref == 'refs/heads/master'
        run: npm run test:article-responsive
      - name: Generated article contents — real MDX fixtures, repeated headings and unpublished exclusions
        if: github.ref == 'refs/heads/master'
        run: npm run test:toc-fixtures
      - name: Responsive and keyboard-operable TOC — headless Chrome
        if: github.ref == 'refs/heads/master'
        run: npm run test:toc-browser
      - name: Source-backed citations — temporary MDX and invalid source build checks
        if: github.ref == 'refs/heads/master'
        run: npm run test:references-fixtures
      - name: Citation navigation and print view — real headless Chrome
        if: github.ref == 'refs/heads/master'
        run: npm run test:references-browser
      - name: Curated related reading — real MDX cross-links and broken-link rejection
        if: github.ref == 'refs/heads/master'
        run: npm run test:related-fixtures
      - name: Related reading compact/cards — real Chrome and keyboard navigation
        if: github.ref == 'refs/heads/master'
        run: npm run test:related-browser
      - name: Media renderer — isolated PNG/SVG assets and generated Astro markup
        if: github.ref == 'refs/heads/master'
        run: npm run test:media-render-fixtures
      - name: Responsive media renderer — real Chrome at 375 and 1440
        if: github.ref == 'refs/heads/master'
        run: npm run test:media-render-browser
