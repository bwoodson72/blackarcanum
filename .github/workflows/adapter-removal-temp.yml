name: Verify static Astro without Vercel adapter (temporary)

on:
  push:
    branches: [chore/prompt-01-baseline]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
      - name: Resolve lockfile after adapter removal
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify clean install
        run: npm ci
      - name: Astro build
        run: npm run build
      - name: Astro typecheck
        run: npm run typecheck
      - name: Confirm no high-severity advisories
        run: npm audit --audit-level=high
      - name: Upload regenerated lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-fixed-lockfile
          path: package-lock.json
