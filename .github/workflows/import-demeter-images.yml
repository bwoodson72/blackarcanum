name: Import Demeter Historical Images (one-time)
on:
  push:
    paths:
      - '.github/workflows/import-demeter-images.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: master
          persist-credentials: true
      - name: Install Pillow
        run: python3 -m pip install --user Pillow
      - name: Download, convert and register historical images
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python3 - <<'PY'
          import io, json, pathlib, urllib.parse, urllib.request
          from PIL import Image, ImageOps
          
          ROOT = pathlib.Path("src/assets/media/reference/greek-deities")
          ROOT.mkdir(parents=True, exist_ok=True)
          HEADERS = {"User-Agent": "MystagogiaEditorial/1.0 (research archive; no contact address)", "Accept": "application/json,image/*,*/*"}
          def download(url):
              req = urllib.request.Request(url, headers=HEADERS)
              with urllib.request.urlopen(req, timeout=45) as response:
                  data = response.read(30_000_001)
              if not data or len(data) > 30_000_000:
                  raise RuntimeError("Missing or oversized image: " + url)
              return data
          
          def to_webp(data, out):
              image = ImageOps.exif_transpose(Image.open(io.BytesIO(data))).convert("RGB")
              if min(image.size) < 400:
                  raise RuntimeError("Source image too small: " + str(image.size))
              image.thumbnail((2000, 2000), Image.Resampling.LANCZOS)
              image.save(out, "WEBP", quality=79, method=6, exif=b"")
              print(out, image.size, out.stat().st_size)
          
          # The original photographs have confirmed open reuse; use their public mirrors
          # rather than rate-limited Wikimedia's upload host from GitHub Actions.
          knidos_url = "https://nyc3.digitaloceanspaces.com/manifold-uw-api-store/store/resource/d/2/c/d2ccda4c-16c6-44d0-88df-2ab6f8a82830/attachment/277c43b83d9cf87db73f82c4b5ded409.jpg"
          to_webp(download(knidos_url), ROOT/"demeter-of-knidos-british-museum.webp")
          met_url = "https://images.metmuseum.org/CRDImages/gr/web-large/DT203390.jpg"
          to_webp(download(met_url), ROOT/"demeter-eleusinian-relief-met.webp")

          registry = pathlib.Path("src/data/media.ts")
          text = registry.read_text()
          if 'id: "demeter-of-knidos-british-museum"' not in text:
              entry = '''
            {
              id: "demeter-of-knidos-british-museum",
              sourceFile: "src/assets/media/reference/greek-deities/demeter-of-knidos-british-museum.webp",
              role: "reference",
              origin: "historical-reproduction",
              alt: "Marble statue of Demeter seated on a throne, excavated at Knidos and now in the British Museum.",
              decorative: false,
              caption: "Demeter of Knidos, seated marble statue from the Sanctuary of Demeter at Knidos, c. 350 BCE. British Museum, 1859,1226.26. Photograph: Raymond.ellis (CC0).",
              creator: "Raymond.ellis (photographer)",
              date: "2011-07-05",
              period: "Late Classical Greek, c. 350 BCE",
              repository: "British Museum; photograph via Wikimedia Commons",
              sourceUrl: "https://commons.wikimedia.org/wiki/File:Marble_Statue_of_Demeter.jpg",
              rights: {
                status: "cleared",
                basis: "cc-license",
                license: "Creative Commons CC0 1.0 Universal Public Domain Dedication; resized and converted to WebP.",
                creditLine: "Photo: Raymond.ellis · CC0 1.0 · resized and converted to WebP",
                evidenceUrl: "https://commons.wikimedia.org/wiki/File:Marble_Statue_of_Demeter.jpg",
              },
            },
            {
              id: "demeter-eleusinian-relief-met",
              sourceFile: "src/assets/media/reference/greek-deities/demeter-eleusinian-relief-met.webp",
              role: "reference",
              origin: "historical-reproduction",
              alt: "Great Eleusinian Relief showing Demeter, the youth Triptolemos, and Persephone; ancient marble fragments displayed within a cast.",
              decorative: false,
              caption: "Ten Roman marble fragments of the Great Eleusinian Relief, c. 27 BCE–14 CE, set into a cast of a fifth-century BCE Greek original. The Metropolitan Museum of Art, accession 14.130.9.",
              date: "c. 27 BCE–14 CE",
              period: "Roman, Augustan; after Classical Greek original",
              repository: "The Metropolitan Museum of Art",
              sourceUrl: "https://www.metmuseum.org/art/collection/search/248899",
              rights: {
                status: "cleared",
                basis: "public-domain",
                license: "The Met Open Access, Public Domain (CC0); resized and converted to WebP.",
                creditLine: "The Metropolitan Museum of Art · Public Domain",
                evidenceUrl: "https://www.metmuseum.org/art/collection/search/248899",
              },
            },
          '''
              if not text.rstrip().endswith("];"): raise RuntimeError("Unexpected media registry structure")
              text = text.rstrip()[:-2] + entry + "];\n"
              registry.write_text(text)
          
          article = pathlib.Path("src/content/library/demeter-harvest-fertility-abundance.mdx")
          doc = article.read_text()
          if "  - demeter-of-knidos-british-museum" not in doc:
              start = "mediaIds:\n  - ploutos-demeter-vase-athens"
              assert start in doc
              doc = doc.replace(start,start+"\n  - demeter-of-knidos-british-museum\n  - demeter-eleusinian-relief-met")
          if '<ReferenceFigure id="demeter-eleusinian-relief-met" lightbox />' not in doc:
              heading = "## Worship Beyond Eleusis"
              assert heading in doc
              doc = doc.replace(heading,'<ReferenceFigure id="demeter-eleusinian-relief-met" lightbox />\n\n'+heading)
          if '<ReferenceFigure id="demeter-of-knidos-british-museum" lightbox />' not in doc:
              heading = "## Demeter's Anger and the Limits of Abundance"
              assert heading in doc
              doc = doc.replace(heading,'<ReferenceFigure id="demeter-of-knidos-british-museum" lightbox />\n\n'+heading)
          article.write_text(doc)
          print("Registered and placed Demeter historical photographs.")
          PY
      - name: Commit two approved WebP references
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/assets/media/reference/greek-deities/demeter-*.webp src/data/media.ts src/content/library/demeter-harvest-fertility-abundance.mdx
          git diff --cached --quiet || git commit -m "Add Demeter Knidos and Eleusinian references with attribution"
          git push origin HEAD:master
