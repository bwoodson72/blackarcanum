name: Verify Mystagogia design tokens (temporary)

on:
  push:
    branches: [feature/prompt-02-design-tokens]

permissions:
  contents: read

jobs:
  tokens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
      - name: Install from committed lockfile
        run: npm ci
      - name: Check Astro
        run: npm run typecheck
      - name: Generate utility probe and build
        shell: bash
        run: |
          set -euo pipefail
          cat > src/pages/__token_probe.astro <<'ASTRO'
          ---
          import Layout from '../layouts/Layout.astro';
          ---
          <Layout>
            <main class="bg-surface text-text-primary border-border-subtle font-display text-body max-w-reading rounded-card shadow-panel gap-article-gap px-gutter py-section">
              <button class="bg-primary text-primary-foreground font-interface text-ui">Test</button>
              <p class="bg-card text-card-foreground text-text-muted">Test content</p>
              <p class="bg-accent-gold text-ink">Test accent</p>
            </main>
          </Layout>
          ASTRO
          npm run build
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          const files = [];
          function visit(dir) {
            if (!fs.existsSync(dir)) return;
            for (const d of fs.readdirSync(dir, { withFileTypes: true })) {
              const p = path.join(dir, d.name);
              if (d.isDirectory()) visit(p);
              else if (p.endsWith('.css')) files.push(p);
            }
          }
          visit('dist');
          visit('.vercel/output/static');
          if (!files.length) throw new Error('No compiled CSS found');
          const css = files.map(p => fs.readFileSync(p, 'utf8')).join('\n');
          const expected = [
            'bg-surface', 'text-text-primary', 'border-border-subtle',
            'font-display', 'text-body', 'max-w-reading', 'rounded-card',
            'shadow-panel', 'gap-article-gap', 'px-gutter', 'py-section',
            'bg-primary', 'text-primary-foreground', 'font-interface',
            'text-ui', 'bg-card', 'text-card-foreground', 'text-text-muted',
            'bg-accent-gold', 'text-ink'
          ];
          const missing = expected.filter(name => !css.includes('.' + name));
          if (missing.length) throw new Error('Missing generated utilities: ' + missing.join(', '));
          const source = fs.readFileSync('src/styles/starwind.css', 'utf8');
          const global = fs.readFileSync('src/styles/global.css', 'utf8');
          if ((source.match(/@import "tailwindcss"/g)||[]).length !== 1 ||
              global.includes('@import "tailwindcss"')) {
            throw new Error('Tailwind must be imported only by Starwind stylesheet');
          }
          if (/--color-blue-|--color-sky-/.test(source)) throw new Error('Starter blue palette remains in Starwind');
          if (!source.includes('--color-antique-gold: #c4a962')) throw new Error('Approved palette missing');
          console.log('PASS: ' + expected.length + ' generated utilities in ' + files.length + ' CSS asset(s)');
          JS
          rm src/pages/__token_probe.astro
      - name: Security audit
        run: npm audit --audit-level=high
