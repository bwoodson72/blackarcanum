name: Prompt 10 verification (temporary)

on:
  push:
    branches:
      - feature/prompt-10-topic-source-registries

permissions:
  contents: read

jobs:
  verify-registries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: npm
      - name: Install
        run: npm ci
      - name: Topic/source registry and citation tests
        run: npm run test:content
      - name: Typecheck (empty registries)
        run: npm run typecheck
      - name: Build (empty registries)
        run: npm run build
      - name: Audit
        run: npm audit --audit-level=high
      - name: Verify only approved pages are generated
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          const html = [];
          function walk(dir) {
            for (const e of fs.readdirSync(dir, { withFileTypes: true })) {
              const p = dir + "/" + e.name;
              if (e.isDirectory()) walk(p);
              else if (p.endsWith(".html")) html.push(p);
            }
          }
          walk("dist");
          assert.deepEqual(html.sort(), ["dist/about/index.html", "dist/index.html"]);
          console.log("PASS: no extra routes or topic landing pages");
          NODE
      - name: Verify unknown topic reference fails content build
        run: |
          cat > src/content/library/qa-registry.mdx <<'MDX'
          ---
          slug: test-registry
          title: Test registry
          description: Build-only validation
          status: draft
          topics:
            - unknown-topic
          ---
          Test fixture, not an article.
          MDX
          rm -rf .astro
          if npm run build > /tmp/topic-reference.log 2>&1; then
            echo "FAIL: unknown topic was accepted"; exit 1
          fi
          if ! grep -q "Unknown topic ID" /tmp/topic-reference.log; then
            cat /tmp/topic-reference.log
            echo "FAIL: unexpected build error"; exit 1
          fi
          echo "PASS: unknown topic ID blocks content build"
      - name: Verify unknown bibliography/citation references fail content build
        run: |
          cat > src/content/library/qa-registry.mdx <<'MDX'
          ---
          slug: test-registry
          title: Test registry
          description: Build-only validation
          status: draft
          sourceIds:
            - unknown-source
          citations:
            - sourceId: unknown-source
              locator:
                page: "3"
          ---
          Test fixture, not an article.
          MDX
          rm -rf .astro
          if npm run build > /tmp/source-reference.log 2>&1; then
            echo "FAIL: unknown sources were accepted"; exit 1
          fi
          if ! grep -q "Unknown source ID" /tmp/source-reference.log || ! grep -q "Unknown citation source ID" /tmp/source-reference.log; then
            cat /tmp/source-reference.log
            echo "FAIL: missing source/citation validation"; exit 1
          fi
          echo "PASS: unknown source IDs and citation IDs block content build"
      - name: Verify reviewed fixture records pass without publishing routes
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const topicPath = "src/data/topics.ts";
          const sourcePath = "src/data/sources.ts";
          const topic = fs.readFileSync(topicPath, "utf8");
          const source = fs.readFileSync(sourcePath, "utf8");
          if (!topic.includes("export const topics: readonly Topic[] = [];")) throw new Error("Unexpected topic registry");
          if (!source.includes("export const sources: readonly SourceRecord[] = [];")) throw new Error("Unexpected source registry");
          fs.writeFileSync(topicPath, topic.replace("export const topics: readonly Topic[] = [];",
            'export const topics: readonly Topic[] = [{ id: "test-topic", label: "Test topic", enabled: true, showInBrowse: false }];'));
          fs.writeFileSync(sourcePath, source.replace("export const sources: readonly SourceRecord[] = [];",
            'export const sources: readonly SourceRecord[] = [{ id: "test-source", title: "Test-only citation", creator: "Test fixture" }];'));
          NODE
          cat > src/content/library/qa-registry.mdx <<'MDX'
          ---
          slug: test-registry
          title: Test registry
          description: Build-only validation
          status: draft
          topics:
            - test-topic
          sourceIds:
            - test-source
          citations:
            - sourceId: test-source
              locator:
                passage: "II.4"
          ---
          Test fixture, not an article.
          MDX
          rm -rf .astro
          npm run build
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import assert from "node:assert/strict";
          assert.ok(fs.existsSync("dist/about/index.html"));
          assert.ok(fs.existsSync("dist/index.html"));
          assert.equal(fs.existsSync("dist/library/test-registry/index.html"), false);
          console.log("PASS: known registries accepted without public article routes");
          NODE
      - name: Verify a duplicate topic registry ID breaks the build
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const path = "src/data/topics.ts";
          const current = fs.readFileSync(path, "utf8");
          fs.writeFileSync(path, current.replace(
            'export const topics: readonly Topic[] = [{ id: "test-topic", label: "Test topic", enabled: true, showInBrowse: false }];',
            'export const topics: readonly Topic[] = [{ id: "test-topic", label: "Test topic", enabled: true, showInBrowse: false }, { id: "test-topic", label: "Duplicate", enabled: true, showInBrowse: false }];'
          ));
          NODE
          rm -rf .astro
          if npm run build > /tmp/duplicate-registry.log 2>&1; then
            echo "FAIL: duplicate registry IDs were accepted"; exit 1
          fi
          if ! grep -q "Duplicate topic ID" /tmp/duplicate-registry.log; then
            cat /tmp/duplicate-registry.log
            echo "FAIL: unexpected registry error"; exit 1
          fi
          echo "PASS: duplicate topic IDs break the content build"
