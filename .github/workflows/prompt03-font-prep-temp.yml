name: Verify self-hosted typography (temporary)

on:
  push:
    branches: [feature/prompt-03-self-hosted-fonts]
    paths: [.github/workflows/prompt03-font-prep-temp.yml]

permissions:
  contents: read

jobs:
  typography:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
      - name: Clean dependencies and Astro diagnostics
        run: |
          npm ci
          npm run typecheck
          npm audit --audit-level=high
      - name: Build ephemeral page exercising three typography roles
        shell: bash
        run: |
          set -euo pipefail
          cat > src/pages/__font_probe.astro <<'ASTRO'
          ---
          import Layout from '../layouts/Layout.astro';
          ---
          <Layout>
            <h1>Mystagogia Heading</h1>
            <section data-reading-content>Reading passage about historical sources.</section>
            <button type="button">Navigation Control</button>
            <output id="font-audit" aria-live="polite">waiting</output>
            <script is:inline>
              window.addEventListener('load', async () => {
                try {
                  const samples = await Promise.all([
                    document.fonts.load('600 42px "Cormorant Garamond"', 'Mystagogia Heading'),
                    document.fonts.load('400 18px "Source Serif 4"', 'Reading passage'),
                    document.fonts.load('400 16px Inter', 'Navigation Control')
                  ]);
                  const heading = getComputedStyle(document.querySelector('h1')).fontFamily;
                  const reading = getComputedStyle(document.querySelector('[data-reading-content]')).fontFamily;
                  const button = getComputedStyle(document.querySelector('button')).fontFamily;
                  const ok = samples.every(result => result.length > 0) &&
                    heading.includes('Cormorant Garamond') &&
                    reading.includes('Source Serif 4') && button.includes('Inter');
                  document.getElementById('font-audit').textContent = ok ? 'FONT_AUDIT_PASS' : 'FONT_AUDIT_FAIL';
                } catch (error) {
                  document.getElementById('font-audit').textContent = 'FONT_AUDIT_ERROR';
                }
              });
            </script>
          </Layout>
          ASTRO
          npm run build
          python3 - <<'PY'
          from pathlib import Path
          import re
          fonts=list(Path('public/fonts').glob('*.woff2'))
          assert len(fonts)==14,len(fonts)
          for p in fonts: assert p.read_bytes()[:4]==b'wOF2', p.name
          for name in ['cormorant-garamond','source-serif-4','inter']:
              license=Path(f'docs/font-licenses/{name}-OFL.txt')
              assert license.is_file() and 'SIL OPEN FONT LICENSE' in license.read_text().upper(),license
          css=Path('src/styles/fonts.css').read_text()
          assert css.count('@font-face')>=14
          assert css.count('font-display: swap;')==14
          for p in fonts: assert p.name in css,p.name
          assert not re.search('fonts\\.googleapis|fonts\\.gstatic|cdn\\.',css,re.I)
          assert 'font-family: var(--font-display)' in css
          assert 'font-family: var(--font-reading)' in css
          assert 'font-family: var(--font-interface)' in css
          assets=list(Path('.vercel/output/static').rglob('*.css'))
          assert assets, 'No compiled CSS in output'
          combined='\n'.join(p.read_text() for p in assets)
          for family in ['Cormorant Garamond','Source Serif 4','Inter']:
              assert family in combined,f'{family} missing in compiled CSS'
          for p in fonts:
              assert (Path('.vercel/output/static/fonts')/p.name).is_file(),p.name
          print(f'FONT_CSS_PASS: {len(fonts)} local WOFF2 files and {len(assets)} compiled CSS files; heading/reading/control faces present')
          PY
          python3 -m http.server 8765 --bind 127.0.0.1 --directory .vercel/output/static > /tmp/mystagogia-font-server.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8765/__font_probe/ -o /tmp/font-probe.html; then break; fi
            sleep 0.5
          done
          test -s /tmp/font-probe.html
          for name in inter-latin-wght-normal cormorant-garamond-latin-wght-normal source-serif-4-latin-wght-normal; do
            curl -fsS "http://127.0.0.1:8765/fonts/$name.woff2" -o "/tmp/$name.woff2"
            cmp "public/fonts/$name.woff2" "/tmp/$name.woff2"
          done
          echo 'FONT_HTTP_PASS: three local faces served over HTTP with identical bytes'
          if command -v google-chrome >/dev/null 2>&1; then
            google-chrome --version
            google-chrome --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=15000 --dump-dom http://127.0.0.1:8765/__font_probe/ > /tmp/font-browser.html 2>/tmp/font-browser.err
            grep 'FONT_AUDIT_PASS' /tmp/font-browser.html
            echo 'FONT_BROWSER_PASS: Chrome loaded all three families and computed styles match roles'
          else
            echo 'FONT_BROWSER_UNAVAILABLE: browser-runner check was not performed'
          fi
          rm src/pages/__font_probe.astro
