name: Prompt 12 verification (temporary)

on:
  push:
    branches:
      - feature/prompt-12-article-cards-pagination

permissions:
  contents: read

jobs:
  verify-article-primitives:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: npm
      - name: Install
        run: npm ci
      - name: Editorial QA, presentation model and build
        run: npm run qa:content
      - name: Typecheck
        run: npm run typecheck
      - name: Security audit
        run: npm audit --audit-level=high
      - name: Verify no editorial articles or new production hub routes
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import assert from "node:assert/strict";
          const paths = [];
          function walk(dir) {
            for (const ent of fs.readdirSync(dir, { withFileTypes: true })) {
              const p = dir + "/" + ent.name;
              if (ent.isDirectory()) walk(p);
              else if (p.endsWith(".html")) paths.push(p);
            }
          }
          walk("dist");
          assert.deepEqual(paths.sort(), [
            "dist/about/index.html", "dist/index.html", "dist/prompt12-qa/index.html"
          ]);
          const html = fs.readFileSync("dist/prompt12-qa/index.html", "utf8");
          assert.match(html, /noindex/);
          assert.match(html, /class="article-card article-card--featured/);
          assert.match(html, /rel="prev"/);
          assert.match(html, /rel="next"/);
          assert.doesNotMatch(html, /<img\b/);
          console.log("PASS: route isolation and semantic text-only HTML snapshot");
          NODE
      - name: Browser responsive checks
        run: node scripts/temp-prompt-12-browser.mjs
