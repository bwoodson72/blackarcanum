name: Verify BaseLayout metadata and accessibility (temporary)

on:
  push:
    branches: [feature/prompt-04-base-layout]
    paths: [.github/workflows/prompt04-layout-temp.yml]

permissions:
  contents: read

jobs:
  layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
      - name: Clean install
        run: npm ci
      - name: Astro diagnostics
        run: npm run typecheck
      - name: Generate ephemeral metadata-override route and build
        shell: bash
        run: |
          set -euo pipefail
          cat > src/pages/metadata-probe.astro <<'ASTRO'
          ---
          import BaseLayout from "../layouts/BaseLayout.astro";
          ---
          <BaseLayout
            title="Layout Override Test"
            description="A verified one-time metadata override."
            image="https://example.org/preview.webp"
          >
            <h1>Temporary override route</h1>
            <script is:inline>
              window.addEventListener("load", () => {
                const skip = document.querySelector("a.skip-link");
                skip.focus();
                const focused = document.activeElement === skip;
                skip.click();
                setTimeout(() => {
                  document.body.dataset.skipResult =
                    focused &&
                    location.hash === "#main-content" &&
                    document.activeElement?.id === "main-content"
                      ? "pass" : "fail";
                }, 40);
              });
            </script>
          </BaseLayout>
          ASTRO
          npm run build
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re
          class Inspect(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.tags=[]; self.title=False; self.title_text=""
              def handle_starttag(self,tag,attrs):
                  self.tags.append((tag,dict(attrs)))
                  if tag=="title":self.title=True
              def handle_endtag(self,tag):
                  if tag=="title":self.title=False
              def handle_data(self,data):
                  if self.title:self.title_text+=data
              def find(self,tag,**attrs):
                  return [a for t,a in self.tags if t==tag and all(a.get(k)==v for k,v in attrs.items())]
              def meta(self,key,value=None):
                  return self.find("meta",**{key:value}) if value else [a for t,a in self.tags if t=="meta" and key in a]
          root=Path(".vercel/output/static")
          def inspect(name):
              text=(root/name).read_text()
              doc=Inspect();doc.feed(text)
              assert "Astro Basics" not in text and "astro.build" not in text
              assert doc.find("html",lang="en")
              assert doc.find("meta",name="viewport")
              assert len(doc.find("main",id="main-content",tabindex="-1"))==1
              assert doc.find("a",href="#main-content")
              assert not doc.find("link",rel="canonical"),"Unknown site must not get canonical URL"
              assert not doc.find("meta",property="og:url"),"Unknown site must not get OG URL"
              assert doc.find("link",rel="icon",href="data:,"),"Neutral favicon fallback missing"
              return doc,text
          home,html=inspect("index.html")
          assert home.title_text=="Mystagogia",home.title_text
          assert home.find("meta",name="description",content="Mystagogia is an editorial project exploring esoteric history and practice.")
          assert home.find("meta",name="robots",content="noindex, nofollow")
          assert home.find("meta",property="og:title",content="Mystagogia")
          assert home.find("meta",name="twitter:card",content="summary")
          assert not home.find("meta",property="og:image")
          assert "<h1" in html and "Editorial site in development." in html
          probe,_=inspect("metadata-probe/index.html")
          assert probe.title_text=="Layout Override Test | Mystagogia",probe.title_text
          assert probe.find("meta",name="description",content="A verified one-time metadata override.")
          assert probe.find("meta",property="og:title",content="Layout Override Test | Mystagogia")
          assert probe.find("meta",property="og:description",content="A verified one-time metadata override.")
          assert probe.find("meta",name="twitter:title",content="Layout Override Test | Mystagogia")
          assert probe.find("meta",name="twitter:description",content="A verified one-time metadata override.")
          assert probe.find("meta",name="twitter:card",content="summary_large_image")
          assert probe.find("meta",property="og:image",content="https://example.org/preview.webp")
          assert probe.find("meta",name="twitter:image",content="https://example.org/preview.webp")
          assert not probe.find("meta",name="robots"),"Public page should not inherit noindex"
          assert len(list(root.rglob("*.html"))) == 2
          print("METADATA_HTML_PASS: default/override meta, noindex, no fabricated URL, skip-to-main, no starter branding")
          PY
      - name: Browser keyboard skip-link test
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 --directory .vercel/output/static >/tmp/base-layout-server.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8765/ -o /tmp/base-home.html; then break; fi
            sleep 0.5
          done
          test -s /tmp/base-home.html
          if command -v google-chrome >/dev/null 2>&1; then
            google-chrome --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=5000 --dump-dom http://127.0.0.1:8765/metadata-probe/ >/tmp/rendered.html 2>/tmp/chrome.err
            grep -q 'href="#main-content"' /tmp/rendered.html
            grep -q 'id="main-content"' /tmp/rendered.html
            grep -q 'data-skip-result="pass"' /tmp/rendered.html
            echo 'LAYOUT_BROWSER_SKIP_PASS: Chrome focused skip link and navigated to main landmark'
          else
            echo 'LAYOUT_BROWSER_UNAVAILABLE: semantic HTML assertions passed; browser unavailable'
          fi
      - name: Dependency security check
        run: npm audit --audit-level=high
