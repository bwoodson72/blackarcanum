name: Verify footer and breadcrumbs (temporary)

on:
  push:
    branches: [feature/prompt-07-footer-breadcrumbs]
    paths: [.github/workflows/prompt07-test-temp.yml]

permissions:
  contents: read

jobs:
  footer-breadcrumbs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
      - name: Create nonindexed breadcrumb fixtures
        shell: bash
        run: |
          mkdir -p src/pages/chrome-parent
          cat > src/pages/chrome-parent/index.astro <<'ASTRO'
          ---
          import BaseLayout from "../../layouts/BaseLayout.astro";
          import type { BreadcrumbTrail } from "../../components/site/Breadcrumbs.astro";
          const breadcrumbs: BreadcrumbTrail = [
            { label: "Home", href: "/" },
            { label: "Parent" },
          ];
          ---
          <BaseLayout noindex title="Breadcrumb Parent Test" breadcrumbs={breadcrumbs}>
            <h1>Breadcrumb Parent Test</h1>
            <a id="child-route" href="/chrome-parent/child/">Visit child</a>
          </BaseLayout>
          ASTRO
          cat > src/pages/chrome-parent/child.astro <<'ASTRO'
          ---
          import BaseLayout from "../../layouts/BaseLayout.astro";
          import type { BreadcrumbTrail } from "../../components/site/Breadcrumbs.astro";
          const breadcrumbs: BreadcrumbTrail = [
            { label: "Home", href: "/" },
            { label: "Parent", href: "/chrome-parent/" },
            { label: "Child" },
          ];
          ---
          <BaseLayout noindex title="Breadcrumb Child Test" breadcrumbs={breadcrumbs}>
            <h1>Breadcrumb Child Test</h1>
            <a id="parent-route" href="/chrome-parent/">Visit parent</a>
          </BaseLayout>
          ASTRO
      - name: Build typecheck audit and verify markup
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm run build
          npm audit --audit-level=high
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          class Doc(HTMLParser):
              def __init__(self): super().__init__();self.nodes=[]
              def handle_starttag(self,t,a):self.nodes.append((t,dict(a)))
              def tags(self,t,**a):
                  return [x for k,x in self.nodes if k==t and all(x.get(key)==v for key,v in a.items())]
          root=Path('.vercel/output/static')
          assert list(root.rglob('*.html'))
          for route in ['index.html','chrome-parent/index.html','chrome-parent/child/index.html']:
              file=root/route
              assert file.is_file(),route
              html=file.read_text();d=Doc();d.feed(html)
              assert len(d.tags('header',**{'class':'site-header'}))==1,route
              assert len(d.tags('footer',**{'class':'site-footer'}))==1,route
              assert len(d.tags('main',id='main-content'))==1,route
              assert d.tags('nav',**{'aria-label':'Footer navigation'}),route
              assert not d.tags('nav',**{'aria-label':'Information and policies'}),route
              assert d.tags('a',href='/',**{'aria-label':'Mystagogia — Home'}),route
              assert d.tags('meta',name='robots',content='noindex, nofollow'),route
              assert '/privacy/' not in html and '/terms/' not in html and '/contact/' not in html
              assert not any(s in html for s in ['Astro Basics','© Brian','Woodson'])
          home=Doc();home.feed((root/'index.html').read_text())
          assert not home.tags('nav',**{'aria-label':'Breadcrumb'})
          parent=Doc();parent.feed((root/'chrome-parent/index.html').read_text())
          child=Doc();child.feed((root/'chrome-parent/child/index.html').read_text())
          assert parent.tags('nav',**{'aria-label':'Breadcrumb'})
          assert child.tags('nav',**{'aria-label':'Breadcrumb'})
          assert parent.tags('a',href='/'),"Parent trail should link Home"
          assert child.tags('a',href='/chrome-parent/'),"Child trail should link working parent"
          assert len(child.tags('ol'))>=1
          assert len(child.tags('span',**{'aria-current':'page'}))==1
          assert len(child.tags('span',**{'aria-hidden':'true'}))>=2
          assert len(parent.tags('span',**{'aria-current':'page'}))==1
          assert 'Breadcrumb Child Test | Mystagogia' in (root/'chrome-parent/child/index.html').read_text()
          assert list(root.rglob('index.html')).__len__()==3
          print('CHROME_MARKUP_PASS: footer on every route, valid hierarchical breadcrumb trails, only working links, anonymous content')
          PY
      - name: Chrome responsive footer, contrast and keyboard focus
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 --directory .vercel/output/static >/tmp/footer-site.log 2>&1 &
          site=$!
          google-chrome --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-extensions --disable-background-networking --remote-debugging-port=9333 --remote-allow-origins='*' --user-data-dir=/tmp/footer-chrome about:blank >/tmp/footer-chrome.log 2>&1 &
          chrome=$!
          trap 'kill "$site" "$chrome" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 80); do
            if curl -sf http://127.0.0.1:8765/chrome-parent/child/ -o /tmp/footer-child.html && curl -sf http://127.0.0.1:9333/json -o /tmp/footer-tabs.json; then break; fi
            sleep 0.25
          done
          test -s /tmp/footer-child.html
          test -s /tmp/footer-tabs.json
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const tabs=await (await fetch('http://127.0.0.1:9333/json')).json();
          const tab=tabs.find(x=>x.type==='page');
          assert(tab?.webSocketDebuggerUrl);
          const ws=new WebSocket(tab.webSocketDebuggerUrl);
          await new Promise((ok,bad)=>{ws.onopen=ok;ws.onerror=bad});
          let id=0;const pending=new Map();
          ws.onmessage=e=>{const x=JSON.parse(e.data);if(!x.id)return;const p=pending.get(x.id);if(!p)return;pending.delete(x.id);x.error?p.reject(new Error(JSON.stringify(x.error))):p.resolve(x.result)};
          const send=(method,params={})=>new Promise((resolve,reject)=>{const n=++id;pending.set(n,{resolve,reject});ws.send(JSON.stringify({id:n,method,params}));setTimeout(()=>{if(pending.has(n)){pending.delete(n);reject(new Error(method+' timeout'))}},12000)});
          const js=async expression=>(await send('Runtime.evaluate',{expression,returnByValue:true,awaitPromise:true})).result?.value;
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const waitFor=async (fn,label)=>{for(let i=0;i<90;i++){let v;try{v=await fn()}catch{}if(v)return v;await sleep(100)}throw Error('Timeout waiting for '+label)};
          const key=async name=>{const code=name==='Tab'?9:27;await send('Input.dispatchKeyEvent',{type:'keyDown',key:name,code:name,windowsVirtualKeyCode:code,nativeVirtualKeyCode:code});await send('Input.dispatchKeyEvent',{type:'keyUp',key:name,code:name,windowsVirtualKeyCode:code,nativeVirtualKeyCode:code})};
          await send('Page.enable');await send('Runtime.enable');
          const url='http://127.0.0.1:8765/chrome-parent/child/';
          for(const width of [375,768,1440]){
            await send('Emulation.setDeviceMetricsOverride',{width,height:900,deviceScaleFactor:1,mobile:false});
            await send('Page.navigate',{url});
            const value=await waitFor(async()=>{
              const a=await js(`(() => {
                const el=document.querySelector('.site-footer');
                const grid=document.querySelector('.site-footer__columns');
                const crumb=document.querySelector('nav[aria-label="Breadcrumb"]');
                if(!el||!grid||!crumb)return null;
                if(parseFloat(getComputedStyle(document.body).marginLeft)!==0)return null;
                const cols=getComputedStyle(grid).gridTemplateColumns.split(' ').filter(Boolean);
                const bg=getComputedStyle(el).backgroundColor;
                return {width:innerWidth,scroll:document.documentElement.scrollWidth,columns:cols.length,background:bg,
                  footerWidth:el.getBoundingClientRect().width,crumbRight:crumb.getBoundingClientRect().right};
              })()`);
              return a?.background==='rgb(26, 26, 26)'?a:null;
            },'footer styles '+width);
            assert.equal(value.width,width);
            assert(value.scroll<=width+1,'Horizontal overflow at '+width+': '+value.scroll);
            assert.equal(value.columns,width<768?1:2,'Incorrect grid columns at '+width);
            assert(value.footerWidth<=width+1);
            assert(value.crumbRight<=width+1,'Breadcrumb overflow at '+width);
            console.log('FOOTER_VIEWPORT_PASS',JSON.stringify(value));
            if(width!==375)continue;
            for(let i=0;i<16;i++){
              await key('Tab');
              const focus=await js(`(() => {
                const el=document.activeElement;
                const footer=document.querySelector('.site-footer');
                if(!footer?.contains(el))return null;
                const style=getComputedStyle(el);
                return {name:el.tagName,href:el.getAttribute('href'),outline:style.outlineStyle,
                  outlineWidth:parseFloat(style.outlineWidth),outlineColor:style.outlineColor,
                  color:style.color,background:getComputedStyle(footer).backgroundColor};
              })()`);
              if(focus){
                assert.equal(focus.name,'A');
                assert.equal(focus.href,'/');
                assert.notEqual(focus.outline,'none');
                assert(focus.outlineWidth>=3,'Focus indicator must be 3px');
                const nums=x=>x.match(/[\d.]+/g).slice(0,3).map(Number);
                const luminance=raw=>{const vals=nums(raw).map(v=>v/255).map(v=>v<=.04045?v/12.92:Math.pow((v+.055)/1.055,2.4));return .2126*vals[0]+.7152*vals[1]+.0722*vals[2];};
                const ratio=(a,b)=>{const l1=luminance(a),l2=luminance(b);return (Math.max(l1,l2)+.05)/(Math.min(l1,l2)+.05)};
                assert(ratio(focus.color,focus.background)>=4.5,'Footer link contrast below 4.5:1');
                assert(ratio(focus.outlineColor,focus.background)>=3,'Focus outline contrast below 3:1');
                console.log('FOOTER_KEYBOARD_CONTRAST_PASS',JSON.stringify({...focus,textContrast:ratio(focus.color,focus.background).toFixed(2),focusContrast:ratio(focus.outlineColor,focus.background).toFixed(2)}));
                break;
              }
              if(i===15)throw Error('Footer link unreachable by keyboard');
            }
          }
          await send('Page.navigate',{url});
          await waitFor(async()=>await js("!!document.querySelector('nav[aria-label=Breadcrumb]')"),'breadcrumb route');
          // Focus is visibly available for breadcrumb links, too.
          await js("document.querySelector('nav[aria-label=Breadcrumb] a[href="/chrome-parent/"]').focus()");
          const crumb=await js(`(() => {
            const a=document.querySelector('nav[aria-label="Breadcrumb"] a[href="/chrome-parent/"]');
            return {text:a.textContent,href:a.getAttribute('href'),focus:document.activeElement===a};
          })()`);
          assert(crumb.focus&&crumb.href==='/chrome-parent/');
          console.log('BREADCRUMB_HIERARCHY_PASS',JSON.stringify(crumb));
          ws.close();
          JS
